name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-check:
    name: Go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - run: go test ./... -race -count=1 -timeout=60s

  cross-build:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [go-check]
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_SHA::7} -X main.commit=${GITHUB_SHA::7}" \
            -o ./bin/hopnet-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/hopnet
      - uses: actions/upload-artifact@v4
        with:
          name: hopnet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./bin/hopnet-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker build (${{ matrix.platforms }})
    runs-on: ubuntu-latest
    needs: [go-check]
    strategy:
      matrix:
        platforms:
          - ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platforms }}
          push: false
          cache-from: type=gha,scope=hopnet-cli
          cache-to: type=gha,mode=max,scope=hopnet-cli
