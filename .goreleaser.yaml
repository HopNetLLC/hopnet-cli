version: 2

project_name: hopnet

before:
  hooks:
    - go mod tidy

builds:
  - id: hopnet
    main: ./cmd/hopnet
    binary: hopnet
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    files:
      - README.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - name: hopnet
    repository:
      owner: HopNetLLC
      name: homebrew-hopnet
      # Required: GoReleaser does NOT auto-discover HOMEBREW_TAP_GITHUB_TOKEN.
      # Without an explicit token template, it falls back to the default
      # GITHUB_TOKEN (a GitHub App installation token scoped to this repo
      # only), which gets 403 "Resource not accessible by integration"
      # when pushing to the tap repo. The PAT lives at release.yml's env
      # block.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/HopNetLLC/hopnet-cli
    description: Disposable network routes for agents, CI, browser automation
    license: ''
    install: |
      bin.install "hopnet"
    test: |
      system "#{bin}/hopnet", "version"
